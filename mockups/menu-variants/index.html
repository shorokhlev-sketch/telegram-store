<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Меню разделов</title>
<meta name="viewport" content="width=1840">
<style>
:root{
  --label:#1D1D1F; --label-2:#6E6E73; --label-3:#86868B; --label-4:#C7C7CC;
  --fill:#F5F5F7; --fill-2:#E8E8ED; --seg:rgba(118,118,128,.12);
  --sep:rgba(60,60,67,.14); --sep-2:rgba(60,60,67,.24);
  --accent:#0071E3; --accent-tint:rgba(0,113,227,.1); --te:#F25B1D; --te-grey:#F2F2F2;
  --dev-edge:rgba(0,0,0,.16);
  --font:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9E9EE}
body{font-family:var(--font);color:var(--label);font-size:17px;line-height:1.41;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;text-align:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums}
.edge{stroke:var(--dev-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.soft{stroke:rgba(0,0,0,.08);stroke-width:1;vector-effect:non-scaling-stroke}

/* ---------- Board ---------- */
.board{width:1840px;margin:0 auto;padding:56px 45px 88px}
.b-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:56px}
.b-hd h1{font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-.03em}
.b-hd span{font-size:13px;color:var(--label-3);letter-spacing:-.01em}
.sec{margin-bottom:96px}
.sec-l{border-top:1px solid var(--sep-2);padding-top:16px;margin-bottom:28px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.024em}
.sec-l span{color:var(--label-3)}
.phones{display:flex;gap:30px;margin-top:48px}
.phones figure{width:414px}
.phones figcaption{margin-top:18px;font-size:15px;letter-spacing:-.016em;color:var(--label-2)}
.phones figcaption b{font-weight:600;color:var(--label);margin-right:6px}
body.mo .b-hd,body.mo .desk{display:none}
body.mo .phones{margin-top:0}
body.mo .sec{margin-bottom:64px}

/* ---------- Desktop window ---------- */
.win{width:1280px;height:720px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 60px -30px rgba(0,0,0,.25);display:flex;flex-direction:column}
.chrome{position:relative;height:38px;flex:none;background:#F3F3F5;border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;gap:8px;padding:0 14px}
.chrome i{width:12px;height:12px;border-radius:6px;background:#D9D9DE}
.chrome .url{position:absolute;left:50%;transform:translateX(-50%);height:24px;width:360px;border-radius:7px;background:#E7E7EB;font-size:12px;color:var(--label-2);display:flex;align-items:center;justify-content:center;letter-spacing:-.01em}
.wb{position:relative;flex:1;overflow:hidden;background:#fff}
.nav{position:absolute;top:0;left:0;right:0;height:44px;z-index:40;background:#fff;border-bottom:1px solid var(--sep)}
.nav-in{max-width:1024px;height:44px;margin:0 auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.nav .brand{font-size:14px;font-weight:600;letter-spacing:-.016em}
.nav .it{height:44px;display:flex;align-items:center;font-size:12px;letter-spacing:-.01em;opacity:.72;transition:opacity .15s}
.nav .it:hover,.nav .it.on{opacity:1}
.nav .tg{font-size:12px;opacity:.72;letter-spacing:-.01em}
.stub{position:absolute;top:44px;left:0;right:0;bottom:0}
.st-in{max-width:1024px;margin:0 auto;padding:0 22px}
.st-h{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--sep)}
.st-h b{font-size:21px;font-weight:600}
.st-h span{font-size:12px;color:var(--label-2)}
.st-g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep);margin-top:40px}
.st-t{background:#fff;padding:24px}
.st-t .im{aspect-ratio:1/1;border-radius:14px;background:var(--fill);display:grid;place-items:center;overflow:hidden}
.st-t b{display:block;font-size:14px;font-weight:600;margin-top:14px}
.st-t span{font-size:14px;color:var(--label-2)}
.veil{position:absolute;top:44px;left:0;right:0;bottom:0;z-index:30}

.im > svg,.im > .ph{width:86%;height:86%}
.th > svg,.th > .ph{width:100%;height:100%}
.im > .ph.cover,.th > .ph.cover{width:100%;height:100%}
.ph{position:relative;display:block}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.ph.cover img{object-fit:cover}
.ph svg{display:none;position:absolute;inset:0;width:100%;height:100%}
.ph.err img{display:none}
.ph.err svg{display:block}

/* ---------- Phone ---------- */
.device{position:relative;width:414px;height:868px;border-radius:66px;background:#1A1A1C;padding:12px;box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 2px #3A3A3C,0 40px 80px -40px rgba(0,0,0,.35)}
.island{position:absolute;top:23px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:200;pointer-events:none}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#fff;isolation:isolate}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:150;display:flex;align-items:center;justify-content:space-between;padding:4px 32px 0 50px;pointer-events:none}
.sbar .t{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sbar .ic{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--label);z-index:160;pointer-events:none}
.mp{position:absolute;inset:0;padding-top:54px;overflow:hidden;background:#fff}
.m-top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px}
.m-top b{font-size:17px;font-weight:600;letter-spacing:-.022em}
.xb{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--label-2)}

/* catalog page (mobile) */
.pt{font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.03em;padding:2px 20px 0}
.pt span{color:var(--label-3);font-weight:600}
.pills{display:flex;gap:8px;overflow:hidden;padding:14px 16px 16px}
.pill{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;letter-spacing:-.016em;white-space:nowrap}
.pill.on{background:var(--accent-tint);color:var(--accent);font-weight:500}
.pill svg{opacity:.8}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:0 16px}
.lt .im{aspect-ratio:1/1;border-radius:14px;background:var(--fill);display:grid;place-items:center;overflow:hidden}
.lt .im > .ph:not(.cover){width:80%;height:80%}
.lt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.016em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .sp{display:block;font-size:12px;line-height:16px;color:var(--label-2);letter-spacing:0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .pr{display:block;font-size:15px;letter-spacing:-.016em;margin-top:3px}

/* =========================================================
   A · Apple x Shop / Airbnb
   ========================================================= */
.veil-a{background:rgba(29,29,31,.2)}
.a-fly{position:absolute;top:54px;left:50%;width:1000px;margin-left:-500px;z-index:35;background:#fff;border-radius:22px;box-shadow:0 24px 60px -12px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05);padding:24px 26px 20px}
.a-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 16px}
.a-card{display:block;width:100%}
.a-card .im{aspect-ratio:2/1;border-radius:14px;background:var(--fill);display:grid;place-items:center;overflow:hidden;transition:background .2s}
.a-card .im > *{transition:transform .35s cubic-bezier(.25,.1,.25,1)}
.a-card .im > .ph:not(.cover){width:74%;height:74%}
.a-card:hover .im,.a-card.press .im{background:#E8E8ED}
.a-card:hover .im > *{transform:scale(1.035)}
.a-card .nm{display:block;font-size:15px;font-weight:600;letter-spacing:-.016em;margin-top:10px}
.a-card .pr{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;letter-spacing:-.01em;margin-top:1px}
.a-card .pr .c{font-size:13px;color:var(--label-3)}
.a-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--sep)}
.a-all{font-size:15px;font-weight:500;color:var(--accent);display:flex;align-items:center;gap:6px}
.a-chips{display:flex;gap:8px}
.a-chip{height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:13px;letter-spacing:-.006em;white-space:nowrap}
.a-chip .c{color:var(--label-3)}
.a-chip:hover{background:var(--fill-2)}
.a-chip.dim{color:var(--label-4);cursor:default}
.a-chip.dim .c{color:var(--label-4)}

.a-fab{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:20;height:50px;padding:0 22px 0 18px;border-radius:999px;background:var(--label);color:#fff;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:-.02em;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.a-behind{position:absolute;inset:0}
.a-scrim{position:absolute;inset:0;background:rgba(0,0,0,.34);z-index:30}
.a-sheet{position:absolute;left:0;right:0;top:58px;bottom:0;z-index:40;background:#fff;border-radius:14px 14px 0 0;overflow:hidden}
.a-grab{width:36px;height:5px;border-radius:3px;background:var(--label-4);margin:6px auto 0}
.a-sh-h{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px}
.a-sh-h b{font-size:20px;font-weight:700;letter-spacing:-.024em}
.am-chips{display:flex;gap:8px;overflow:hidden;padding:2px 16px 16px}
.am-chip{flex:none;height:42px;display:flex;align-items:center;gap:8px;padding:0 14px 0 5px;border-radius:999px;background:var(--fill);font-size:15px;letter-spacing:-.016em}
.am-chip .th{width:32px;height:32px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;padding:4px}
.am-chip .th > .ph.cover{padding:0}
.am-chip .c{font-size:13px;color:var(--label-3)}
.am-chip.on{background:var(--label);color:#fff;font-weight:600}
.am-chip.on .c{color:rgba(255,255,255,.6);font-weight:400}
.am-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 16px}
.am-grid .a-card .im{aspect-ratio:16/10}
.am-grid .a-card .nm{font-size:15px;margin-top:7px}
.am-all{width:calc(100% - 32px);display:flex;align-items:center;justify-content:space-between;height:50px;margin:14px 16px 0;border-top:1px solid var(--sep);font-size:17px;color:var(--accent)}
.am-cond{display:flex;gap:8px;padding:0 16px}

/* =========================================================
   B · Apple x Teenage Engineering
   ========================================================= */
.veil-b{background:rgba(255,255,255,.74)}
.nav-b .nav-in{max-width:1120px;padding:0 40px}
.nav-b .it.on{box-shadow:inset 0 -1.5px 0 var(--label)}
.b-fly{position:absolute;top:44px;left:0;right:0;z-index:35;background:#fff;border-bottom:1px solid var(--label)}
.b-in{max-width:1120px;margin:0 auto;padding:22px 40px 30px}
.b-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--label)}
.b-meta{display:flex;gap:28px;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--label-3);text-transform:uppercase}
.b-meta b{font-weight:400;color:var(--label)}
.b-all{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--label);display:flex;gap:8px;align-items:center}
.b-all:hover{color:var(--te)}
.b-body{display:grid;grid-template-columns:1fr 248px;gap:40px}
.b-grid{display:grid;grid-template-columns:repeat(3,1fr);align-content:start}
.b-cell{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:16px;border-bottom:1px solid rgba(0,0,0,.12);border-left:1px solid rgba(0,0,0,.12);text-align:left;transition:background .12s}
.b-cell:nth-child(3n+1){border-left:0;padding-left:0}
.b-cell .th{width:88px;height:88px;border-radius:3px;background:var(--te-grey);display:grid;place-items:center;overflow:hidden;padding:6px}
.b-cell .th > .ph.cover{padding:0}
.b-cell .tx{min-width:0;display:flex;flex-direction:column}
.b-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--label-3)}
.b-top .ix{display:flex;align-items:center;gap:5px}
.b-top .ix::before{content:"";width:5px;height:5px;background:var(--label-4)}
.b-cell .nm{font-size:15px;line-height:1.25;font-weight:400;letter-spacing:-.018em;margin:5px 0 1px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.b-cell .mem{font-family:var(--mono);font-size:10.5px;letter-spacing:0;color:var(--label-3)}
.b-cell .pr{font-family:var(--mono);font-size:11.5px;letter-spacing:0;margin-top:auto;padding-top:8px;align-self:flex-end;white-space:nowrap}
.b-cell:hover{background:#F7F7F8}
.b-cell:hover .ix{color:var(--label)}
.b-cell:hover .ix::before{background:var(--te)}
.b-cell.pad{pointer-events:none}
.b-k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--label-3);padding:14px 0 7px;border-bottom:1px solid var(--label)}
.b-r{display:grid;grid-template-columns:24px 1fr 72px 22px;gap:8px;align-items:center;width:100%;height:33px;border-bottom:1px solid rgba(0,0,0,.12);font-size:13px;letter-spacing:-.01em;text-align:left}
.b-r .lt{width:16px;height:16px;border:1px solid var(--label);display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:0;line-height:1}
.b-r .c{font-family:var(--mono);font-size:11px;text-align:right;letter-spacing:0}
.b-r.dim{color:var(--label-4);cursor:default}
.b-r.dim .lt{border-color:var(--label-4)}
.b-r:not(.dim):hover .mt i.f{background:var(--te)}
.mt{display:flex;gap:2px;height:8px}
.mt i{flex:1;background:#E6E6E9}
.mt i.f{background:var(--label)}

.b-menu{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pt-b{font-size:30px;font-weight:400;letter-spacing:-.035em}
.pt-b sup{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--label-3);margin-left:3px;position:relative;top:-12px}
.pills-b .pill{height:30px;padding:0 10px;border-radius:2px;background:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.pills-b .pill.on{background:var(--label);color:#fff;box-shadow:none;font-weight:400}
.lgrid-b{gap:1px;padding:0;margin:0 16px;background:rgba(0,0,0,.12);border-top:1px solid var(--label);border-bottom:1px solid rgba(0,0,0,.12)}
.lgrid-b .lt{background:#fff;padding:10px 10px 14px}
.lgrid-b .lt:nth-child(2n+1){padding-left:0}
.lgrid-b .lt:nth-child(2n){padding-right:0}
.lgrid-b .lt .im{border-radius:3px;background:var(--te-grey)}
.lgrid-b .lt b{font-weight:400;font-size:14px}
.lgrid-b .lt .sp{font-family:var(--mono);font-size:10px;color:var(--label-3)}
.lgrid-b .lt .pr{font-family:var(--mono);font-size:12px;letter-spacing:0;margin-top:6px}
.bm-words{padding:4px 20px 18px;font-size:27px;line-height:35px;font-weight:400;letter-spacing:-.035em;color:#B4B4B9}
.bm-words button{margin-right:10px}
.bm-words button.on{color:var(--label)}
.bm-list{margin:0 20px;border-top:1px solid var(--label)}
.bm-row{display:grid;grid-template-columns:20px 48px 1fr auto;gap:12px;align-items:center;width:100%;height:62px;border-bottom:1px solid rgba(0,0,0,.12);text-align:left}
.bm-row .ix{font-family:var(--mono);font-size:10px;color:var(--label-3);letter-spacing:.04em}
.bm-row .th{width:48px;height:48px;border-radius:3px;background:var(--te-grey);display:grid;place-items:center;overflow:hidden;padding:4px}
.bm-row .th > .ph.cover{padding:0}
.bm-row .nm{font-size:15px;letter-spacing:-.018em;line-height:1.2;display:block}
.bm-row .mem{font-family:var(--mono);font-size:10.5px;color:var(--label-3);letter-spacing:0;display:block;margin-top:2px}
.bm-row .rt{text-align:right;font-family:var(--mono);letter-spacing:0}
.bm-row .rt b{display:block;font-weight:400;font-size:11.5px}
.bm-row .rt span{display:block;font-size:10.5px;color:var(--label-3);margin-top:2px}
.bm-row.press{background:var(--te-grey);box-shadow:-20px 0 0 var(--te-grey),20px 0 0 var(--te-grey)}
.bm-row.press .ix{color:var(--te)}
.bm-aside{margin:0 20px}
.bm-all{width:calc(100% - 40px);display:flex;align-items:center;justify-content:space-between;height:48px;margin:0 20px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}

/* =========================================================
   C · Apple x Linear / Raycast
   ========================================================= */
.veil-c{background:rgba(250,250,252,.82)}
.c-trig-d{display:flex;align-items:center;gap:7px;height:28px;padding:0 6px 0 10px;border-radius:8px;font-size:12px;letter-spacing:-.01em;color:var(--label)}
.c-trig-d svg{color:var(--label-3)}
.c-trig-d:hover,.c-trig-d.on{background:var(--seg)}
.c-pop{position:absolute;top:50px;left:50%;width:780px;margin-left:-390px;z-index:35;background:#fff;border-radius:14px;box-shadow:0 20px 50px -10px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.08);overflow:hidden}
.c-seg{display:flex;margin:10px;background:var(--seg);border-radius:9px;padding:2px}
.c-seg button{flex:1 1 auto;padding:0 12px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.c-seg button .c{font-size:11px;color:var(--label-3);font-weight:400}
.c-seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
.c-fil{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 16px;border-top:1px solid var(--sep);border-bottom:1px solid var(--sep);color:var(--label-3)}
.c-fil input{flex:1;height:44px;border:0;outline:0;background:none;font-size:15px;color:var(--label);letter-spacing:-.016em}
.c-fil input::placeholder{color:var(--label-3)}
.kc{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 0 rgba(0,0,0,.1);font-size:11px;line-height:1;color:var(--label-2);letter-spacing:0}
.c-body{display:grid;grid-template-columns:1fr 300px;height:396px}
.c-list{padding:4px 6px 8px;overflow-y:auto;scrollbar-width:none}
.c-k{font-size:12px;color:var(--label-3);padding:10px 10px 4px;letter-spacing:-.006em}
.c-row{display:grid;grid-template-columns:28px 1fr auto 26px;gap:10px;align-items:center;width:100%;height:36px;padding:0 10px 0 6px;border-radius:8px;font-size:14px;letter-spacing:-.012em;text-align:left}
.c-row .th{width:28px;height:28px;border-radius:6px;background:var(--fill);display:grid;place-items:center;overflow:hidden;padding:2px}
.c-row .th > .ph.cover{padding:0}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.q{color:var(--label-2)}
.nm mark{background:none;color:var(--label);font-weight:650}
.c-row .p{font-size:13px;color:var(--label-3)}
.c-row .c{font-size:13px;color:var(--label-3);text-align:right}
.c-row.sel{background:#EFEFF2}
.c-row.go{background:var(--accent);color:#fff}
.c-row.go .p,.c-row.go .c,.c-row.go .nm.q,.c-row.go .nm mark{color:#fff}
.lt-g{width:28px;display:grid;place-items:center}

  const s = e.target.closest("[data-seg]");
  if (s && S.C.d !== s.dataset.seg){ S.C.d = s.dataset.seg; S.C.dq = ""; S.C.dsel = 0; renderCD(); return; }
  if (e.target.closest("[data-trig]")){ S.C.open = !S.C.open; renderCD(); if (S.C.open) document.getElementById("cq").focus(); return; }
  if (e.target.closest("[data-close]")){ S.C.open = false; renderCD(); }
});
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); S.C.open = !S.C.open; renderCD(); if (S.C.open) document.getElementById("cq").focus(); }
});
cD.addEventListener("input", e => { if (e.target.id !== "cq") return; S.C.dq = e.target.value; S.C.dsel = 0; updateC(); });
cD.addEventListener("keydown", e => {
  if (e.target.id !== "cq") return;
  const n = cMatch(cat(S.C.d), S.C.dq).length;
  if (e.key === "ArrowDown" && n){ e.preventDefault(); S.C.dsel = (S.C.dsel + 1) % n; updateC(); }
  else if (e.key === "ArrowUp" && n){ e.preventDefault(); S.C.dsel = (S.C.dsel - 1 + n) % n; updateC(); }
  else if (e.key === "Enter" && n){ const r = cD.querySelector(".c-row.sel"); if (r){ r.classList.add("go"); setTimeout(() => r.classList.remove("go"), 220); } }
  else if (e.key === "Escape"){ if (S.C.dq){ S.C.dq = ""; e.target.value = ""; S.C.dsel = 0; updateC(); } else { S.C.open = false; renderCD(); } }
});
cD.addEventListener("mouseover", e => { const r = e.target.closest(".c-row[data-i]"); if (!r) return; const i = +r.dataset.i; if (i === S.C.dsel) return; S.C.dsel = i;
  cD.querySelectorAll(".c-row[data-i]").forEach(x => x.classList.toggle("sel", +x.dataset.i === i)); document.getElementById("cp").innerHTML = cPrevHTML(); });

renderAD(); renderBD(); renderCD();
</script>
</body>
